        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getShuffledItems(key, items) {
      try {
        const saved = localStorage.getItem(key);
        if (saved) {
          const order = JSON.parse(saved);
          if (Array.isArray(order) && order.length === items.length) {
            return order.map(i => items[i]);
          }
        }
        const indices = shuffleArray(items.map((_, i) => i));
        localStorage.setItem(key, JSON.stringify(indices));
        return indices.map(i => items[i]);
      } catch (e) {
        return shuffleArray(items);
      }
    }

    async function sendToSheets(type, answers, ts) {
      if (!GAS_URL) return { skipped: true };
      try {
        await fetch(GAS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ type, answers, timestamp: ts }), redirect: "follow" });
        return { success: true };
      } catch (e) { console.error("送信エラー:", e); return { success: false, error: e.message }; }
    }

    // --- Anonymous code existence check (GAS doGet). Fails open: any error/timeout => "unknown".
    async function checkCode(type, code) {
      if (!GAS_URL || !code) return "unknown";
      let tm;
      try {
        const ctl = new AbortController(); tm = setTimeout(() => ctl.abort(), 6000);
        const r = await fetch(GAS_URL + "?action=check&type=" + type + "&code=" + encodeURIComponent(code), { signal: ctl.signal });
        const j = await r.json();
        if (j && j.result === "success" && typeof j.exists === "boolean") return j.exists ? "exists" : "none";
      } catch (e) { } finally { if (tm) clearTimeout(tm); }
      return "unknown";
    }

      const okFormat = (s) => s.length >= 4 && s.length <= 20 && /^[\p{L}\p{N}_-]+$/u.test(s) && !/^(.)\1*$/u.test(s);
      const [text, setText] = useState(value || "");
      const [autoLoaded, setAutoLoaded] = useState(false);

      const [status, setStatus] = useState(""); // "" | "checking" | "exists" | "none" | "unknown"
      const [generated, setGenerated] = useState(false);
      const latest = React.useRef("");
      const ID_WORDS = ["maple", "river", "cloud", "ember", "willow", "harbor", "meadow", "lantern", "pebble", "aurora", "cedar", "comet", "falcon", "glacier", "juniper", "orchid", "sparrow", "tundra", "violet", "zephyr", "amber", "breeze", "coral", "dune", "fern", "hazel", "iris", "moss", "opal", "pine", "quartz", "sage"];
      const genId = () => { const a = new Uint32Array(2); (window.crypto || window.msCrypto).getRandomValues(a); return ID_WORDS[a[0] % ID_WORDS.length] + (1000 + (a[1] % 9000)); };
      const onGen = async () => { for (let i = 0; i < 5; i++) { const c = genId(); setText(c); setTouched(true); onChange(c); latest.current = c; setStatus("checking"); const r = await checkCode("pre", c); if (r !== "exists" || i === 4) { if (latest.current === c) setStatus(r); setGenerated(true); return; } } };
      const n = norm(text);
      const valid = okFormat(n);

      const runCheck = async (code) => { latest.current = code; setStatus("checking"); const r = await checkCode("pre", code); if (latest.current === code) setStatus(r); };
      const onText = (v) => { setText(v); setGenerated(false); setStatus(""); latest.current = ""; const nn = norm(v); onChange(okFormat(nn) ? nn : ""); };
      const onBlurText = (e) => { e.target.style.borderColor = P.bdr; setTouched(true); if (valid && status === "") runCheck(n); };
      useEffect(() => { if (isPost && !value) { try { const saved = localStorage.getItem("survey_anon_code"); if (saved) { const sv = norm(saved); if (okFormat(sv)) { setText(sv); onChange(sv); setAutoLoaded(true); runCheck(sv); } } } catch (e) { } } }, []);

            <h2 style={h2}>Invitation to Participate</h2>

            <p style={para}>Before deciding whether to participate, please read the following information carefully. Participation is voluntary. You may choose not to participate or withdraw from the study at any time without penalty.</p>

            <h2 style={h2}>Purpose of the Study</h2>

            <p style={{ ...para, marginBottom: 6 }}>You are eligible to participate if:</p>

              <li style={li}>After creating your study ID, you will be guided to the study activity. Please follow the instructions and complete the activity. The activity is expected to take approximately 20 minutes.</li>
              <li style={li}>After completing the activity, you will be directed to a post-activity survey. The survey is expected to take approximately 20 minutes. You will also be asked to provide a written reflection on your experience of the activity, which is expected to take approximately 10 minutes.</li>
              <li style={li}>You may take different courses taught by the PI during the 2026–2027 academic year. You may choose whether or not to participate in this study again when you take another course taught by the PI during the same academic year.</li>
              <li style={li}>If you choose to participate again, you will be asked one additional question about whether your interpretation of the experience has changed after completing the activity. This additional question will take approximately 5 minutes to complete. If you choose not to participate again and would like to receive extra credit, you may complete an alternative extra-credit activity for the course.</li>
            </ul>

            <h2 style={h2}>Participants' Benefits</h2>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div><h3 style={{ fontFamily: "'Noto Sans JP',sans-serif", fontSize: 17, color: "rgba(255,255,255,0.85)", margin: "0 0 6px", fontWeight: 500 }}>{T("ゲーム体験前のご質問")}</h3>
                  <p style={{ fontSize: 13, color: "rgba(255,255,255,0.6)", margin: 0, lineHeight: 1.6 }}>{(LANG === "en" ? "Background, life satisfaction, coping, meaning, and playfulness" : T("人生満足度、コーピングに関する質問"))}</p>
                  <p style={{ fontSize: 12, color: P.acc, margin: "6px 0 0", fontWeight: 500 }}>{LANG === "en" ? "Estimated time: about 10 min" : T("推定時間：3〜5分")}</p></div>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B8AF0" strokeWidth="2.5"><path d="M9 18l6-6-6-6" /></svg>
              </div>
            </button>

            <a href={LANG === "en" ? GAME_URL_EN : GAME_URL} target="_blank" rel="noopener noreferrer" style={{ display: "block", background: "linear-gradient(135deg,rgba(232,164,74,0.15),rgba(200,130,40,0.2))", border: "1.5px solid rgba(232,164,74,0.4)", borderRadius: 12, padding: "24px 28px", textAlign: "left", cursor: "pointer", transition: "all 0.2s", boxShadow: "0 2px 8px rgba(0,0,0,0.2)", textDecoration: "none" }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = P.acc; e.currentTarget.style.boxShadow = "0 4px 20px rgba(232,164,74,0.3)"; e.currentTarget.style.background = "linear-gradient(135deg,rgba(232,164,74,0.25),rgba(200,130,40,0.3))" }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "rgba(232,164,74,0.4)"; e.currentTarget.style.boxShadow = "0 2px 8px rgba(0,0,0,0.2)"; e.currentTarget.style.background = "linear-gradient(135deg,rgba(232,164,74,0.15),rgba(200,130,40,0.2))" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div><h3 style={{ fontFamily: "'Noto Sans JP',sans-serif", fontSize: 17, color: "rgba(255,255,255,0.85)", margin: "0 0 6px", fontWeight: 500 }}>{T("ゲーム体験")}</h3>
                  <p style={{ fontSize: 13, color: "rgba(255,255,255,0.6)", margin: 0, lineHeight: 1.6 }}>{T("ゲームを体験してください")}</p>
                  <p style={{ fontSize: 12, color: P.acc, margin: "6px 0 0", fontWeight: 500 }}>{T("推定時間：20〜30分　|　全3ステージ")}</p>{LANG === "en" && GAME_NOTE_EN && <p style={{ fontSize: 12, color: "rgba(255,255,255,0.6)", margin: "6px 0 0", lineHeight: 1.6 }}>{GAME_NOTE_EN}</p>}</div>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={P.acc} strokeWidth="2.5"><path d="M9 18l6-6-6-6" /></svg>
              </div>
            </a>

            <button onClick={() => { setView("post"); setAns({}); setOth({}); setDone(false); setErrs(false); setGs(null); window.scrollTo(0, 0) }}
              style={{ background: "linear-gradient(135deg,rgba(91,138,240,0.15),rgba(43,94,167,0.2))", border: "1.5px solid rgba(91,138,240,0.35)", borderRadius: 12, padding: "24px 28px", textAlign: "left", cursor: "pointer", transition: "all 0.2s", boxShadow: "0 2px 8px rgba(0,0,0,0.2)" }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = "#5B8AF0"; e.currentTarget.style.boxShadow = "0 4px 20px rgba(91,138,240,0.3)"; e.currentTarget.style.background = "linear-gradient(135deg,rgba(91,138,240,0.25),rgba(43,94,167,0.3))" }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "rgba(91,138,240,0.35)"; e.currentTarget.style.boxShadow = "0 2px 8px rgba(0,0,0,0.2)"; e.currentTarget.style.background = "linear-gradient(135deg,rgba(91,138,240,0.15),rgba(43,94,167,0.2))" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div><h3 style={{ fontFamily: "'Noto Sans JP',sans-serif", fontSize: 17, color: "rgba(255,255,255,0.85)", margin: "0 0 6px", fontWeight: 500 }}>{T("ゲーム体験後のご質問")}</h3>
                  <p style={{ fontSize: 13, color: "rgba(255,255,255,0.6)", margin: 0, lineHeight: 1.6 }}>{(LANG === "en" ? "Your experience of reading the story about Jordan, coping, meaning, and emotions, plus a short written reflection" : T("人生満足度、コーピングに関する質問"))}</p>
                  <p style={{ fontSize: 12, color: P.acc, margin: "6px 0 0", fontWeight: 500 }}>{LANG === "en" ? "Estimated time: about 25–30 min in total (survey and written reflection)" : T("推定時間：3〜5分")}</p></div>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B8AF0" strokeWidth="2.5"><path d="M9 18l6-6-6-6" /></svg>
              </div>
            </button>
          </div>
          <div style={{ borderTop: "1px solid rgba(255,255,255,0.1)", paddingTop: 24, textAlign: "center" }}>
            <p style={{ fontSize: 12, color: "rgba(255,255,255,0.7)", lineHeight: 1.8, marginBottom: 20 }}>{T("この回答をもちまして，本研究の協力に同意いただいたものとさせていただきます。")}<br />{T("すべての回答は匿名です。")}</p>
            <div style={{ fontSize: 12, color: "rgba(255,255,255,0.6)", lineHeight: 1.9, textAlign: "center" }}>
{LANG === "en" ? <>
              <p style={{ margin: 0 }}>Questions about this study: Principal Investigator Noriko Toyokawa, Ph.D., Southern Oregon University<br /><a href="mailto:toyokawan@sou.edu" style={{ color: "#7BA4F7" }}>toyokawan@sou.edu</a> · 541-522-6858<br />Co-Investigator Toru Fujimoto, Professor, The University of Tokyo.<br />Co-Investigator Hironori Sakai, Ph.D., The University of Tokyo.<br />Questions about your rights as a participant: Southern Oregon University Institutional Review Board · 541-552-8290</p>
            </> : <>
              <p style={{ margin: "0 0 4px", fontWeight: 500, color: "rgba(255,255,255,0.85)" }}>{T("調査責任者：東京大学情報学環　藤本　徹")}</p>
              <p style={{ margin: "0 0 4px", fontWeight: 500, color: "rgba(255,255,255,0.85)" }}>{T("調査実施者：東京大学情報学環　坂井裕紀")}</p>
              <p style={{ margin: "0 0 16px", fontWeight: 500, color: "rgba(255,255,255,0.85)" }}>{T("調査実施者：南オレゴン大学　豊川典子")}</p>
              <p style={{ margin: 0 }}>{T("ご不明な点がありましたら，下記までご連絡ください。")}<br />{T("連絡先（坂井 裕紀：さかい ひろのり）：")}<a href="mailto:hironori.sakai@iii.u-tokyo.ac.jp" style={{ color: "#7BA4F7" }}>hironori.sakai@iii.u-tokyo.ac.jp</a><br />{T("連絡先（豊川典子：とよかわ のりこ）：")}<a href="mailto:toyokawan@sou.edu" style={{ color: "#7BA4F7" }}>toyokawan@sou.edu</a></p>
            </>}
            </div>
          </div>
        </div>
      </div>;

      // DONE
      if (done) return <div style={{ minHeight: "100vh", background: "transparent", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <div style={{ textAlign: "center", padding: "60px 24px", maxWidth: 600 }}>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}><LangSwitch lang={lang} onChange={switchLang} /></div>
          <div style={{ fontSize: 48, marginBottom: 16 }}>✓</div>
          <h2 style={{ fontFamily: "'Noto Serif JP',serif", fontSize: 22, color: P.pri, marginBottom: 12 }}>{view === "post" ? T("ご体験ありがとうございました") : T("ご回答ありがとうございました")}</h2>
          {view === "pre" ? <div><p style={{ fontSize: 15, color: P.mut, lineHeight: 1.8, maxWidth: 400, margin: "0 auto 20px" }}>{T("ゲーム体験前のご質問への回答が完了しました。データは正常に記録されました。")}</p><div style={{ background: "rgba(91,138,240,0.12)", border: `1.5px solid ${P.pri}`, borderRadius: 10, padding: "16px 20px", margin: "0 auto 24px", maxWidth: 400 }}><p style={{ fontSize: 12, color: P.mut, margin: "0 0 6px" }}>{T("あなたの匿名コード")}</p><p style={{ fontSize: 26, fontWeight: 700, letterSpacing: 2, fontFamily: "monospace", margin: "0 0 8px", wordBreak: "break-all" }}>{ans.q1}</p><p style={{ fontSize: 12, color: P.mut, margin: 0, lineHeight: 1.7 }}>{T("このコードはゲームの体験や事後アンケートでも使用します。")}<br />{T("記録しておいてください。")}</p></div></div> : <div style={{ textAlign: "left", margin: "0 auto 28px" }}>
            {LANG !== "en" && <p style={{ fontSize: 15, color: P.mut, lineHeight: 1.8, marginBottom: 20 }}>{T("「あなたは何を選ぶ？-ゲームで体験する喪失と生の価値」の体験お疲れ様でした")}</p>}
            {LANG !== "en" && <p style={{ fontSize: 14, color: P.mut, lineHeight: 1.9, marginBottom: 20 }}>{T("この体験が、あなたの健康と幸福の支えとなり")}<br />{T("より充実した人生の一助となることを願っています")}</p>}
          </div>}
          <div>{<button onClick={reset} style={{ padding: "12px 32px", background: "transparent", color: P.pri, border: `2px solid ${P.pri}`, borderRadius: 8, fontSize: 14, cursor: "pointer", fontWeight: 600, transition: "all 0.2s" }}
            onMouseEnter={e => { e.target.style.background = P.pri; e.target.style.color = "#fff" }} onMouseLeave={e => { e.target.style.background = "transparent"; e.target.style.color = P.pri }}>{T("トップに戻る")}</button>}</div>
        </div>
      </div>;

      // FORM
      const isPre = view === "pre"; const total = tot(); const answered = cnt(); const missing = errs ? miss() : [];
      const missingCount = missing.length;
      const showErrBanner = errs === true && missingCount > 0;
      return <div style={{ minHeight: "100vh", background: "transparent" }}>
        <div style={{ maxWidth: 720, margin: "0 auto", padding: "0 20px 60px" }}>
          <Bar cur={answered} tot={total} />
          <div style={{ padding: "28px 0 20px", borderBottom: `1px solid ${P.bdr}`, marginBottom: 28, position: "relative" }}>
            <div style={{ position: "absolute", top: 24, right: 0 }}><LangSwitch lang={lang} onChange={switchLang} /></div>
            <button onClick={() => { if (window.confirm(T("回答内容は保存されません。トップに戻りますか？"))) reset() }} style={{ background: "none", border: "none", color: P.mut, cursor: "pointer", fontSize: 13, padding: 0, marginBottom: 12, display: "flex", alignItems: "center", gap: 4 }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6" /></svg>{T("トップに戻る")}
            </button>
            <h1 style={{ fontFamily: "'Noto Sans JP',sans-serif", fontSize: 22, color: "rgba(255,255,255,0.85)", margin: 0, fontWeight: 500 }}>{isPre ? T("ゲーム体験前のご質問") : T("ゲーム体験後のご質問")}</h1>
          </div>

          {showErrBanner && <div style={{ background: "rgba(240,112,112,0.12)", border: "1px solid rgba(240,112,112,0.3)", borderRadius: 10, padding: "14px 20px", marginBottom: 24 }}>
            <p style={{ color: P.err, fontSize: 14, margin: 0, fontWeight: 500 }}>{LANG === "en" ? `${T("未回答の必須項目が")} ${missingCount}. ${T("件あります。ご確認ください。")}` : `未回答の必須項目が ${missingCount} 件あります。ご確認ください。`}</p>
          </div>}

          <div style={{ background: P.card, border: `1px solid ${P.bdr}`, borderRadius: 10, padding: "20px 24px", marginBottom: 32 }}>
            <h3 style={{ fontFamily: "'Noto Sans JP',sans-serif", fontSize: 13, color: P.acc, margin: "0 0 16px", fontWeight: 600 }}>{LANG === "en" ? (isPre ? "PART I: DEMOGRAPHIC & BACKGROUND INFORMATION" : "Study ID") : "Q1"}</h3>
            {(isPre ? PRE_X().demo : POST.code).map(q => {
              const fieldErr = errs === true && missing.includes(q.id);
              return <div key={q.id} id={`f-${q.id}`}>
                <DQ q={q} value={ans[q.id]} onChange={v => sa(q.id, v)} ov={oth[q.id]} onOv={v => so(q.id, v)} dupCode={dupCode} />
                {fieldErr && <p style={{ color: P.err, fontSize: 12, margin: "-16px 0 16px", fontWeight: 500 }}>{q.type === "code" ? T("有効な匿名コードを入力してください") : T("この項目は必須です")}</p>}
              </div>;
            })}
          </div>

          {isPre ? (LANG === "en" ? <>
            <div id="f-q10"><p style={{ fontFamily: "'Noto Serif JP',serif", fontSize: 15, color: P.acc, margin: "0 0 12px", fontWeight: 600, letterSpacing: 0.5 }}>PART II: PRE-TEST SURVEY</p></div>
            <SS key="en-swls" section={PRE_EN.swls} storageKey="survey_order_pre_swls" answers={ans} set={sa} />
            <div id="f-q18"><SS key="en-cses" section={PRE_EN.cses} storageKey="survey_order_pre_cses" answers={ans} set={sa} /></div>
            <SS key="en-cop" section={PRE_EN.cop} storageKey="survey_order_pre_cop_en" answers={ans} set={sa} />
            <SS key="en-3dm" section={PRE_EN.meaning} storageKey="survey_order_pre_3dm_en" answers={ans} set={sa} />
            <SS key="en-play" section={PRE_EN.play} storageKey="survey_order_pre_play_en" answers={ans} set={sa} />
          </> : <>
            <div id="f-q10"><SS section={PRE.swls} storageKey="survey_order_pre_swls" answers={ans} set={sa} /></div>
            <div id="f-q18"><SS section={PRE.cses} storageKey="survey_order_pre_cses" answers={ans} set={sa} /></div>
          </>) : (LANG === "en" ? <>
            <div style={{ marginBottom: 32 }}>
              <div style={{ background: "linear-gradient(90deg,#1E3A6E,#2B5EA7)", color: "#fff", padding: "16px 24px", borderRadius: "10px 10px 0 0", fontFamily: "'Noto Serif JP',serif" }}><h2 style={{ margin: 0, fontSize: 17, fontWeight: 600 }}>PART I: EXPERIENCE &amp; MANIPULATION CHECK</h2></div>
              <div style={{ background: P.card, border: `1px solid ${P.bdr}`, borderTop: "none", borderRadius: "0 0 10px 10px", padding: "8px 24px 16px" }}><div id="f-q60"><DQ q={POST_EN.completed} value={ans.q60} onChange={v => sa("q60", v)} ov={oth.q60} onOv={v => so("q60", v)} /></div></div>
            </div>
            <div id="f-q61"><SS key="pe-engage" section={POST_EN.engage} storageKey="survey_order_post_engage_en" answers={ans} set={sa} /></div>
            <p style={{ fontFamily: "'Noto Serif JP',serif", fontSize: 15, color: P.acc, margin: "0 0 12px", fontWeight: 600, letterSpacing: 0.5 }}>PART II: POST-TEST SURVEY</p>
            <div id="f-q64"><SS key="pe-coping" section={POST_EN.coping} storageKey="survey_order_post_coping_en" answers={ans} set={sa} /></div>
            <div id="f-q10"><SS key="pe-cses" section={POST_EN.cses} storageKey="survey_order_post_cses" answers={ans} set={sa} /></div>
            <div id="f-q7"><SS key="pe-mean" section={POST_EN.mean} storageKey="survey_order_post_mean_en" answers={ans} set={sa} /></div>
            <div id="f-q2"><SS key="pe-swls" section={POST_EN.swls} storageKey="survey_order_post_swls" answers={ans} set={sa} /></div>
            <div id="f-q41"><SS key="pe-emot" section={POST_EN.emot} storageKey="survey_order_post_emot_en" answers={ans} set={sa} /></div>
            <div id="f-q49"><SS key="pe-refl" section={POST_EN.refl} storageKey="survey_order_post_refl" answers={ans} set={sa} /></div>
            <div style={{ marginBottom: 32 }}>
              <div style={{ background: "linear-gradient(90deg,#1E3A6E,#2B5EA7)", color: "#fff", padding: "16px 24px", borderRadius: "10px 10px 0 0", fontFamily: "'Noto Serif JP',serif" }}><h2 style={{ margin: 0, fontSize: 17, fontWeight: 600 }}>PART III: QUALITATIVE WRITTEN REFLECTION</h2></div>
              <div style={{ background: P.card, border: `1px solid ${P.bdr}`, borderTop: "none", borderRadius: "0 0 10px 10px", padding: "8px 24px 16px" }}><p style={{ fontSize: 14, color: "#fff", lineHeight: 1.8, margin: "12px 0 8px" }}>Please write a brief reflection responding to the prompt below. There are no right or wrong answers; we are interested in your personal thoughts and insights.</p><div id="f-q70"><DQ q={POST_EN.reflect} value={ans.q70} onChange={v => sa("q70", v)} ov={oth.q70} onOv={v => so("q70", v)} /></div><div id="f-q71"><DQ q={POST_EN.repeat} value={ans.q71} onChange={v => sa("q71", v)} ov={oth.q71} onOv={v => so("q71", v)} /></div>{ans.q71 && ans.q71.indexOf("Yes") === 0 && <div id="f-q72"><DQ q={POST_EN.longit} value={ans.q72} onChange={v => sa("q72", v)} ov={oth.q72} onOv={v => so("q72", v)} /></div>}</div>
            </div>
          </> : <>
            <div id="f-q2"><SS section={POST.swls} storageKey="survey_order_post_swls" answers={ans} set={sa} /></div>
            <div id="f-q10"><SS section={POST.cses} storageKey="survey_order_post_cses" answers={ans} set={sa} /></div>
            <div id="f-q41"><SS section={POST.emot} storageKey="survey_order_post_emot" answers={ans} set={sa} /></div>
            <div id="f-q49"><SS section={POST.refl} storageKey="survey_order_post_refl" answers={ans} set={sa} /></div>
            <div style={{ marginBottom: 32 }}>
              <div style={{ background: "linear-gradient(90deg,#1E3A6E,#2B5EA7)", color: "#fff", padding: "16px 24px", borderRadius: "10px 10px 0 0", fontFamily: "'Noto Serif JP',serif" }}><h2 style={{ margin: 0, fontSize: 17, fontWeight: 600 }}>§7.</h2></div>
              <div style={{ background: P.card, border: `1px solid ${P.bdr}`, borderTop: "none", borderRadius: "0 0 10px 10px", padding: "8px 24px 16px" }}>
                {POST.gameSelect.map((q, idx) => <div key={q.id} id={`f-${q.id}`}><DQ q={q} value={ans[q.id]} onChange={v => sa(q.id, v)} ov={oth[q.id]} onOv={v => so(q.id, v)} displayNum={idx + 1} /></div>)}
              </div>
            </div>
          </>)}

          <div style={{ textAlign: "center", padding: "20px 0 40px" }}>
            <p style={{ fontSize: 13, color: P.mut, marginBottom: 16 }}>{T("すべての回答を入力したら、「完了」ボタンを押してください。")}</p>
            <button onClick={submit} disabled={saving} style={{ padding: "14px 48px", background: P.pri, color: "#fff", border: "none", borderRadius: 10, fontSize: 16, fontWeight: 600, cursor: saving ? "wait" : "pointer", transition: "all 0.2s", opacity: saving ? 0.7 : 1, boxShadow: "0 2px 12px rgba(91,138,240,0.3)" }}
              onMouseEnter={e => { if (!saving) e.target.style.background = P.priL }} onMouseLeave={e => { if (!saving) e.target.style.background = P.pri }}>{saving ? T("送信中...") : T("完了")}</button>
          </div>
        </div>
      </div>;
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>

</html>
